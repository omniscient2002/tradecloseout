name: TradeCloseout CI/CD Pipeline (15 §4)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradecloseout
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF and independent archive test tools
        run: sudo apt-get update && sudo apt-get install -y qpdf unzip

      - name: Setup pnpm & Node.js 22
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install offline verifier test browser
        run: pnpm --filter @tradecloseout/web exec playwright install --with-deps chromium

      - name: Static Type Verification
        run: pnpm typecheck

      - name: Build Monorepo Workspaces
        run: pnpm build

      - name: Apply PostgreSQL 16 Migrations & Forced RLS
        env:
          MIGRATOR_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tradecloseout
        run: pnpm db:migrate

      - name: Run API, isolated DB and worker, shared, PDF and offline browser regressions
        env:
          APP_DATABASE_URL: postgres://tc_app:app_local_pw@127.0.0.1:5432/tradecloseout
          MIGRATOR_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tradecloseout
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm test

      - name: Run Mandatory Negative Security & RLS Test Suite (05 §12)
        env:
          APP_DATABASE_URL: postgres://tc_app:app_local_pw@127.0.0.1:5432/tradecloseout
          MIGRATOR_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tradecloseout
        run: pnpm test:security

      - name: Run production-built application browser auth contract
        env:
          E2E_BASE_URL: http://127.0.0.1:3002
          NEXT_PUBLIC_ENABLE_DEV_PERSONAS: 'false'
        run: |
          set -euo pipefail
          pnpm --filter @tradecloseout/web start >/tmp/tradecloseout-g01-next.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3002/login >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Production-built Next application failed to start'
            cat /tmp/tradecloseout-g01-next.log
            exit 1
          fi
          pnpm --filter @tradecloseout/web exec playwright test --project=application --grep "E2E-G01"

      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-verifier-browser-results
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
